<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../../icons/icon128.png" alt=""><span class="name">Tab Defaults for X</span></div>
  <h1>メディア欄は、動画ではなく<em>「画像」</em>から</h1>
  <p class="sub">Media tab opens on “Photos” instead of “Videos”.</p>

  <div class="stage">
    <div class="card">
      <div class="label">Before · X のデフォルト</div>
      <div class="tabs">
        <div class="tab">ポスト</div>
        <div class="tab">返信</div>
        <div class="tab">リポスト</div>
        <div class="tab active">動画<span class="chev"></span></div>
        <div class="tab">記事</div>
      </div>
      <div class="grid">
        <div class="cell video"></div><div class="cell video"></div><div class="cell video"></div>
        <div class="cell video"></div><div class="cell video"></div><div class="cell video"></div>
      </div>
    </div>
    <div class="arrow">→</div>
    <div class="card">
      <div class="label after">After · この拡張</div>
      <div class="tabs">
        <div class="tab">ポスト</div>
        <div class="tab">返信</div>
        <div class="tab">リポスト</div>
        <div class="tab active hl">画像<span class="chev"></span></div>
        <div class="tab">記事</div>
      </div>
      <div class="grid">
        <div class="cell photo"></div><div class="cell photo"></div><div class="cell photo"></div>
        <div class="cell photo"></div><div class="cell photo"></div><div class="cell photo"></div>
      </div>
    </div>
  </div>

  <div class="foot"><span>ドロップダウンで手動で選び直した場合は尊重</span><span>x.com / twitter.com のみで動作</span></div>
</div>
</body>
</html>
