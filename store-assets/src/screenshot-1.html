<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../../icons/icon128.png" alt=""><span class="name">Tab Defaults for X</span></div>
  <h1>プロフィールを開いたら、最初から<em>「すべて」</em></h1>
  <p class="sub">Open profiles with “All” instead of “Posts” — automatically, no reload.</p>

  <div class="stage">
    <div class="card">
      <div class="label">Before · X のデフォルト</div>
      <div class="tabs">
        <div class="tab active">ポスト<span class="chev"></span></div>
        <div class="tab">返信</div>
        <div class="tab">リポスト</div>
        <div class="tab">メディア</div>
        <div class="tab">記事</div>
      </div>
      <div class="feed">
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
      </div>
    </div>
    <div class="arrow">→</div>
    <div class="card">
      <div class="label after">After · この拡張</div>
      <div class="tabs">
        <div class="tab active hl">すべて<span class="chev"></span></div>
        <div class="tab">返信</div>
        <div class="tab">リポスト</div>
        <div class="tab">メディア</div>
        <div class="tab">記事</div>
      </div>
      <div class="feed">
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
        <div class="post"><div class="avatar"></div><div><div class="line w40"></div><br><div class="line w85"></div><br><div class="line w60"></div></div></div>
      </div>
    </div>
  </div>

  <div class="foot"><span>リロードなし</span><span>設定不要（変更も可）</span><span>データ収集なし</span></div>
</div>
</body>
</html>
